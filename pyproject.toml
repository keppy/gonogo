[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gonogo-eval"
dynamic = ["version"]
description = "Decide whether an agent is good enough to ship. Honest statistics for pilot-scale case sets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "James Dominguez" }]
keywords = ["llm", "agents", "evaluation", "calibration", "selective-prediction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# No runtime dependencies, on purpose. A reference implementation you can read
# in one sitting should not drag in a dependency tree.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/keppy/gonogo"
Source = "https://github.com/keppy/gonogo"

[tool.hatch.version]
path = "gonogo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gonogo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
